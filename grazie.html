<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Richiesta ricevuta · AI Som</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="landing.css">
<script src="analytics.js"></script>
<style>
main{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 16px}
.box{max-width:560px}.icon{font-size:56px;margin-bottom:20px}
h1{font-size:clamp(32px,6vw,46px);margin-bottom:16px}
ol{text-align:left;max-width:440px;margin:22px auto 30px;display:grid;gap:10px;color:var(--tx);padding-left:22px}
</style>
</head>
<body>
<main><div class="box">
  <div class="icon">🍷</div>
  <h1>Richiesta <span class="cop">ricevuta</span></h1>
  <p id="testo">Grazie. Ti ricontattiamo per organizzare la prova sul tuo locale.</p>
  <ol id="passi">
    <li>Ti chiamiamo o ti scriviamo per conoscere il locale.</li>
    <li>Ti chiediamo il materiale che serve.</li>
    <li>Ti mostriamo il risultato prima di qualsiasi decisione.</li>
  </ol>
  <a class="btn btn-ghost" href="/">← Torna al sito</a>
</div></main>
<script>
(function () {
  var o = new URLSearchParams(location.search).get('offerta')
  var materiale = { sommelier: 'menù e carta dei vini (PDF, foto o link)', margini: 'una ricetta e i costi principali del locale' }
  if (materiale[o]) document.querySelector('#passi li:nth-child(2)').textContent = 'Ti chiediamo ' + materiale[o] + '.'
  try { if (window.gtag) window.gtag('event', 'lead_confermato', { offerta: o || 'generico' }) } catch (e) { /* niente */ }
})()
</script>
</body>
</html>
